# Reverse proxy pré-prod pour Nyx : nginx en frontal sur localhost, l'app Next.js buildée
# (server.ts custom, HTTP + WebSocket) derrière, jamais exposée directement au host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nyx_app {
    server app:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    # Terminal Kali des labs/TP : connexion WebSocket longue durée, timeouts étendus pour ne pas
    # couper une session active pendant qu'un utilisateur travaille dans le terminal.
    location /ws/terminal {
        proxy_pass http://nyx_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://nyx_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
