# Pile pré-prod : l'app buildée en production (pas de bind-mount du code source, pas de hot
# reload) derrière nginx, en local sur http://localhost:8080. Réutilise les services déjà lancés
# par `docker-compose.yml` (postgres, redis, piper) via leur réseau —
# démarre-les d'abord avec `docker compose up -d postgres redis piper`.
#
# Lancement :
#   docker-compose -f docker-compose.preprod.yml up -d --build
# Puis ouvrir http://localhost:8080
#
# Les URLs ci-dessous utilisent les noms de service Docker (postgres, redis),
# pas "localhost" comme dans .env.local — depuis l'intérieur du conteneur app, "localhost" se
# désignerait lui-même, pas les autres conteneurs.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env.local
    environment:
      - NODE_ENV=production
      - DOCKER_SOCKET=/var/run/docker.sock
      - DATABASE_URL=postgresql://nyx:${POSTGRES_PASSWORD:-nyx_dev_secret}@postgres:5432/nyx?schema=public
      - DIRECT_URL=postgresql://nyx:${POSTGRES_PASSWORD:-nyx_dev_secret}@postgres:5432/nyx?schema=public
      - REDIS_URL=redis://redis:6379
      - PIPER_URL=http://piper:8000
      - NEXTAUTH_URL=http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads_data:/app/storage
    networks:
      - nyx_default
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nyx_default
    restart: unless-stopped

networks:
  nyx_default:
    external: true

volumes:
  uploads_data:
